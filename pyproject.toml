[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-agent-qa"
version = "0.1.0"
description = "A stem agent that specializes itself into a Python QA agent."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "coverage>=7.0.0",
    "pydantic>=2.0.0",
    "duckduckgo-search>=6.0",
]

[tool.setuptools.packages.find]
include = ["stem_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
